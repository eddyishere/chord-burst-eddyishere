name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          tar --exclude=_site --exclude=.git --exclude=.github -cf - . | tar -C _site -xf -

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          post_status=$?
          if [ "$post_status" -ne 0 ]; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
